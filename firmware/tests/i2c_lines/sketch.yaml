# Pinned build environment (arduino-cli sketch profile). Same block in every Phase 0 sketch.
# Build:  arduino-cli compile <sketch folder>      (or: python firmware/build_all.py)
profiles:
  esp32:
    fqbn: esp32:esp32:esp32wrover
    platforms:
      - platform: esp32:esp32 (3.3.8)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - RTClib (2.1.4)
      - Adafruit BME280 Library (2.3.0)
      - Adafruit BMP280 Library (3.0.0)
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit BusIO (1.17.4)
      - INA226 (0.6.6)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
      - dir: ../../libraries/PvDaq
default_profile: esp32
